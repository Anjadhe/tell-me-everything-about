<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>tmea.space</title>
<meta name="color-scheme" content="light dark">
<!-- The page stays an extension page and shows tmea.space in a frame, rather
     than redirecting to it: a new tab that is still the extension's own page
     keeps the browser's focus in the address bar, the way the built-in new
     tab does. A redirect would hand focus to the site. -->
<style>
  html, body { height: 100%; margin: 0; background: #f5f5f3; }
  @media (prefers-color-scheme: dark) { html, body { background: #131312; } }
  iframe { display: block; width: 100%; height: 100%; border: 0; }
</style>
</head>
<body>
<iframe src="https://tmea.space/" title="Tell me everything about" allow="clipboard-write"></iframe>
</body>
</html>
